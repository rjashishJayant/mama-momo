<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Brand Warm Crimson to Chili Red -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Dumpling Dough Gradient -->
    <linearGradient id="doughGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFFBEB" />
      <stop offset="75%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Dumpling Shadow Gradient -->
    <radialGradient id="doughShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FEF3C7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for soft glow / shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Dumpling Base Shadow -->
  <ellipse cx="64" cy="100" rx="42" ry="10" fill="url(#doughShadow)" />

  <!-- Momo / Dumpling Body -->
  <path d="M 24,78 
           C 22,94 42,102 64,102 
           C 86,102 106,94 104,78 
           C 103,66 94,56 82,50 
           C 74,46 68,44 64,44 
           C 60,44 54,46 46,50 
           C 34,56 25,66 24,78 Z"
        fill="url(#doughGrad)" 
        stroke="#F59E0B" 
        stroke-width="1.5" 
        filter="url(#softGlow)" />

  <!-- Pleats (Intricate folds gathered at top center) -->
  <path d="M 64,44 Q 64,72 64,96" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45" />
  <path d="M 54,47 Q 48,70 42,91" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45" />
  <path d="M 44,53 Q 34,70 30,82" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M 74,47 Q 80,70 86,91" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45" />
  <path d="M 84,53 Q 94,70 98,82" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Top Pinch Knot / Swirl Crown -->
  <ellipse cx="64" cy="45" rx="7" ry="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
  <path d="M 61,45 C 63,42 66,42 67,46" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cheerful / Artisanal Cute Dimple / Smile Accent -->
  <path d="M 56,84 Q 64,90 72,84" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Rising Steam Swirl 1 (Center-Left) -->
  <path d="M 58,38 C 54,30 64,24 58,16 C 55,12 58,8 60,6" 
        fill="none" 
        stroke="url(#steamGrad)" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- Rising Steam Swirl 2 (Center-Right) -->
  <path d="M 68,36 C 73,28 65,22 71,15 C 74,11 70,7 68,5" 
        fill="none" 
        stroke="url(#steamGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Rising Steam Swirl 3 (Right subtle wisp) -->
  <path d="M 78,39 C 83,32 78,27 82,21" 
        fill="none" 
        stroke="url(#steamGrad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.75" />

  <!-- Tiny Golden Sparkle (Top Right) -->
  <path d="M 100,20 L 102,24 L 106,26 L 102,28 L 100,32 L 98,28 L 94,26 L 98,24 Z" fill="#FDE047" opacity="0.9" />
</svg>