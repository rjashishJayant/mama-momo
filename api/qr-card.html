<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mama Momo - Scan to Order QR Code</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card-wrap {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 36px 28px 32px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(220, 38, 38, 0.12);
      border: 2px solid #fee2e2;
      position: relative;
    }
    .badge-icon {
      font-size: 3.2rem;
      margin-bottom: 8px;
      display: inline-block;
    }
    h1 {
      color: #dc2626;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 22px;
    }
    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      border: 3px solid #dc2626;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .qr-frame img {
      width: 240px;
      height: 240px;
      display: block;
      border-radius: 8px;
    }
    .scan-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .promo-box {
      background: #fffbeb;
      border: 1.5px dashed #f59e0b;
      padding: 12px 14px;
      border-radius: 12px;
      color: #92400e;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.35;
    }
    .url-text {
      font-size: 0.82rem;
      color: #9ca3af;
      word-break: break-all;
      margin-bottom: 24px;
    }
    .actions-bar {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-print {
      background: #dc2626;
      color: #ffffff;
    }
    .btn-print:hover {
      background: #b91c1c;
    }
    .btn-download {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .btn-download:hover {
      background: #e5e7eb;
    }
    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .card-wrap {
        box-shadow: none;
        border: 2px solid #dc2626;
        margin: 0 auto;
      }
      .actions-bar {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="card-wrap">
    <div class="badge-icon">🥟</div>
    <h1>Mama Momo</h1>
    <div class="subtitle">Scan with phone camera to view menu &amp; order</div>

    <div class="qr-frame">
      <img src="qrcode.png" alt="Scan to order at Mama Momo" />
    </div>

    <div class="scan-pill">
      📱 Point camera to scan &amp; order
    </div>

    <div class="promo-box">
      🎁 Flat 50% Off On Your 5th Visit!
    </div>

    <div class="url-text">https://mama-momo.vercel.app/</div>

    <div class="actions-bar">
      <button type="button" class="btn btn-print" onclick="window.print()">🖨️ Print Standee</button>
      <a href="qrcode.png" download="mama-momo-qr.png" class="btn btn-download">⬇️ Download QR</a>
    </div>
  </div>
</body>
</html>
